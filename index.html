<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSBTS</title>

<style>

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: url('assets/sydney.jpg') center center no-repeat;
    background-size: cover;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.05);
}

.content {
    position: relative;
    z-index: 10;
    text-align: center;
    padding-top: 20px;
    color: #c8d6c1;
}

h1 {
    margin: 0;
    font-size: 58px;
    font-weight: 300;
    letter-spacing: 1px;
}

.tagline {
    margin-top: 55px;
    font-size: 22px;
    font-weight: 300;
}

.email {
    margin-top: 30px;
}

.email img {
    max-width: 320px;
    height: auto;
}

@media (max-width: 768px) {

    h1 {
        font-size: 40px;
    }

    .tagline {
        font-size: 18px;
        padding: 0 20px;
    }

    .email img {
        max-width: 250px;
    }

}

</style>
</head>

<body>

<div class="overlay"></div>

<div class="content">

    <h1>NSBTS</h1>

    <div class="tagline">
        Providing Business Technology Services &amp; Solutions in Sydney
    </div>

    <div class="email">
        assets/email.png
    </div>

</div>

</body>
</html>
